name: Captain fallback CI

on:
  push:
    branches:
      - 'automation/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: captain-fallback-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallback-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Show Python version
        run: python3 --version

      - name: Compile fallback Python
        run: python3 -m compileall -q fallback parking

      - name: Install test runner only
        run: python3 -m pip install --disable-pip-version-check --no-input pytest

      - name: Run offline-safe fallback regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 -m pytest -q
          fallback/Sandbox
          fallback/Settings
          fallback/Memory
          fallback/Research
          parking

      - name: Record live-runtime-only checks
        run: |
          echo 'Deferred locally: fallback/Router/test_scope_pair_http.py requires the Captain HTTP runtime.'
          echo 'Run it with Doctor/router/OpenBuilder regressions when the authorized laptop is reachable.'
