name: Captain fallback CI

on:
  push:
    branches:
      - 'automation/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: captain-fallback-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallback-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Show Python version
        run: python3 --version

      - name: Compile fallback Python
        run: python3 -m compileall -q fallback parking

      - name: Install test runner only
        run: python3 -m pip install --disable-pip-version-check --no-input pytest

      - name: Run fallback regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m pytest -q fallback parking
